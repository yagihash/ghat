name: "Run Actions Security Check"

on:
  pull_request:
  push:
    branches:
      - "main"

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - uses: cicd-sensor/cicd-sensor-action@6511eb44c91d71b2b93d71193b1bf2cb18352f66 # v0.0.38
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            workflows:
              - '.github/**'
              - 'action.yml'

  ghalint:
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      attestations: read

    steps:
      - uses: cicd-sensor/cicd-sensor-action@6511eb44c91d71b2b93d71193b1bf2cb18352f66 # v0.0.38
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install ghalint
        run: |
          # renovate: datasource=github-releases depName=suzuki-shunsuke/ghalint
          version=v1.5.6
          gh release download -R suzuki-shunsuke/ghalint "${version}" -p "ghalint_${version#v}_linux_amd64.tar.gz"
          gh attestation verify "ghalint_${version#v}_linux_amd64.tar.gz" \
            -R suzuki-shunsuke/ghalint \
            --signer-workflow suzuki-shunsuke/go-release-workflow/.github/workflows/release.yaml
          tar xzf "ghalint_${version#v}_linux_amd64.tar.gz" ghalint
        env:
          GH_TOKEN: ${{ github.token }}

      # Run the two independent ghalint checks concurrently using the new
      # parallel steps feature (background steps + wait-all).
      # https://github.blog/changelog/2026-06-25-actions-steps-can-now-be-run-in-parallel/
      - name: Run ghalint run
        run: ./ghalint run
        background: true

      - name: Run ghalint act
        run: ./ghalint act
        background: true

      - wait-all:

  actionlint:
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      attestations: read

    steps:
      - uses: cicd-sensor/cicd-sensor-action@6511eb44c91d71b2b93d71193b1bf2cb18352f66 # v0.0.38
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install actionlint
        run: |
          # renovate: datasource=github-releases depName=rhysd/actionlint
          version=v1.7.12
          gh release download -R rhysd/actionlint "${version}" -p "actionlint_${version#v}_linux_amd64.tar.gz"
          gh attestation verify "actionlint_${version#v}_linux_amd64.tar.gz" --repo rhysd/actionlint
          tar xzf "actionlint_${version#v}_linux_amd64.tar.gz" actionlint
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Run actionlint
        run: ./actionlint
