name: Run pinact

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  pinact:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: main

      - name: Create GitHub App Token
        id: token
        uses: yagihash/ghmint-action@4b6f18dd790d506f0b06022d7d2786c07655f769 # v0.0.1
        with:
          scope: ${{ github.repository }}
          policy: writer

      - name: Setup git
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          gh auth setup-git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run pinact
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          curl -L -o pinact.tar.gz 'https://github.com/suzuki-shunsuke/pinact/releases/download/v3.8.0/pinact_linux_amd64.tar.gz'
          gh attestation verify pinact.tar.gz \
            --repo suzuki-shunsuke/pinact \
            --signer-workflow suzuki-shunsuke/go-release-workflow/.github/workflows/release.yaml
          tar xzf pinact.tar.gz pinact

          ./pinact run README.md -u

          git add README.md
          git commit -m "chore: update README.md to refer latest version [skip ci]" || echo "No changes to commit"

          git push origin main
