name: CI

on:
  pull_request:
  push:
    branches:
      - "main"

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      workflows: ${{ steps.filter.outputs.workflows }}
      go: ${{ steps.filter.outputs.go }}
    steps:
      - uses: cicd-sensor/cicd-sensor-action@2bc31a18949a77cd5f5bd452f24f00fbb507cdf6 # v0.0.41

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: gh auth setup-git
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          token: ${{ github.token }}
          filters: |
            # ghalint / jactionlint の検査対象（と、その設定）だけを見る。.github/ 配下でも CODEOWNERS や release.yml などでは走らせない。
            workflows:
              - '.github/workflows/**'
              - '**/action.yml'
              - '**/action.yaml'
              - '.github/jactionlint.yaml'
              - '.github/jactionlint.yml'
              - '.ghalint.yaml'
              - '.ghalint.yml'
              - 'ghalint.yaml'
              - 'ghalint.yml'
              - '.github/ghalint.yaml'
              - '.github/ghalint.yml'
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'Dockerfile'
              - 'mise.toml'

  check-actions-security:
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      attestations: read

    steps:
      - uses: cicd-sensor/cicd-sensor-action@2bc31a18949a77cd5f5bd452f24f00fbb507cdf6 # v0.0.41

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: yagihash/actions/check-actions-security@9f208d1c7c8bdccc9fb897307a18b15375ee5000 # v0.2.0

  test:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: cicd-sensor/cicd-sensor-action@2bc31a18949a77cd5f5bd452f24f00fbb507cdf6 # v0.0.41
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '1.27'

      - name: go test
        run: |
          go test -v -cover -race ./...

      - name: go build
        run: |
          CGO_ENABLED=0 GOOS=linux go build -ldflags="-s" -trimpath -o /dev/null ./cmd/ghat
          CGO_ENABLED=0 GOOS=linux go build -ldflags="-s" -trimpath -o /dev/null ./cmd/post

  verify:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read

    steps:
      - uses: cicd-sensor/cicd-sensor-action@2bc31a18949a77cd5f5bd452f24f00fbb507cdf6 # v0.0.41
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The digest in action.yml is the integrity anchor of the released action.
      # Only build-release.yml (running on tagpr-* branches) may change it; any
      # other PR touching the image reference is rejected here.
      - name: Verify image reference is unchanged
        if: "!startsWith(github.head_ref, 'tagpr-')"
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          BASE_IMAGE=$(git show "origin/$BASE_REF:action.yml" | grep -oP 'docker://[^ "]+' | head -1)
          HEAD_IMAGE=$(grep -oP 'docker://[^ "]+' action.yml | head -1)

          if [ "$BASE_IMAGE" != "$HEAD_IMAGE" ]; then
            echo "FAIL: the image reference in action.yml may only be updated by the build-release workflow (tagpr-* branches)"
            echo "Base: $BASE_IMAGE"
            echo "Head: $HEAD_IMAGE"
            exit 1
          fi
          echo "OK: image reference unchanged ($HEAD_IMAGE)"

      - name: Login to GHCR
        if: startsWith(github.head_ref, 'tagpr-')
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify action.yml digest
        if: startsWith(github.head_ref, 'tagpr-')
        env:
          REGISTRY: ghcr.io
          REPOSITORY: ${{ github.repository }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          BRANCH_TAG="${HEAD_REF//\//-}"
          EXPECTED_TAG="$REGISTRY/$REPOSITORY:$BRANCH_TAG"
          echo "Expecting image: $EXPECTED_TAG"

          # imagetools returns the digest of the top-level manifest (index) even
          # when the image also carries attestation manifests
          MANIFEST_DIGEST=$(docker buildx imagetools inspect "$EXPECTED_TAG" --format '{{.Manifest.Digest}}' 2>/dev/null || true)
          if [ -z "$MANIFEST_DIGEST" ]; then
            echo "Image $EXPECTED_TAG not found. The build workflow may not have run yet."
            exit 1
          fi

          EXPECTED_DIGEST="$REGISTRY/$REPOSITORY@$MANIFEST_DIGEST"
          ACTUAL_DIGEST=$(grep -oP 'ghcr\.io/[^ "]+' action.yml | head -1)

          if [ "$ACTUAL_DIGEST" != "$EXPECTED_DIGEST" ]; then
            echo "FAIL: action.yml digest mismatch"
            echo "Expected: $EXPECTED_DIGEST"
            echo "Actual:   $ACTUAL_DIGEST"
            exit 1
          fi
          echo "OK: action.yml digest matches $EXPECTED_TAG"

  # The one check that a ruleset requires. Every job above is in `needs`: it fails when one of them failed or was cancelled, and passes
  # when they passed or were skipped (no workflow changed). A job added above has to be added here.
  ci-ok:
    if: always()
    needs: [changes, check-actions-security, test, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - uses: yagihash/actions/ci-ok@b2075301726190d59d2cf57e54d62700c55ae134 # v0.1.0
        with:
          needs: ${{ toJSON(needs) }}
          filter-job: changes
          filter-outputs: |
            workflows
            go
