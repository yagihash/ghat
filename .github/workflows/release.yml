name: Build and Release Action

on:
  push:
    tags:
      - "v*.*.*"

env:
  REGISTRY: ghcr.io

jobs:
  release:
    runs-on: ubuntu-latest
    environment:
      name: main
      deployment: false
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write

    steps:
      - uses: cicd-sensor/cicd-sensor-action@6511eb44c91d71b2b93d71193b1bf2cb18352f66 # v0.0.38
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag Docker Image
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
          REGISTRY: ${{ env.REGISTRY }}
          REPOSITORY: ${{ github.repository }}
        run: |
          TAG="$GITHUB_REF_NAME"
          MAJOR="${TAG%%.*}"
          IMAGE_PATH="$REGISTRY/$REPOSITORY"

          DIGEST=$(grep -oP '(?<=docker://)ghcr\.io[^ "]+' action.yml | head -1)

          docker pull "$DIGEST"
          docker tag "$DIGEST" "$IMAGE_PATH:$TAG"
          docker tag "$DIGEST" "$IMAGE_PATH:$MAJOR"
          docker push "$IMAGE_PATH:$TAG"
          docker push "$IMAGE_PATH:$MAJOR"

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT }}

      - name: Create GitHub App Token
        id: token
        uses: ./
        with:
          app_id: ${{ secrets.BOT_GITHUB_APP_ID }}
          kms_key_id: ${{ secrets.KMS_KEY_ID }}
          kms_keyring_id: ${{ secrets.KMS_KEYRING_ID }}
          kms_location: ${{ vars.KMS_LOCATION }}
          kms_project_id: ${{ vars.KMS_PROJECT_ID }}
          owner: yagihash
          repositories: |
            ghat
          permission_contents: write

      - name: Setup git
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          gh auth setup-git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Update major version tag
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          TAG="$GITHUB_REF_NAME"
          MAJOR="${TAG%%.*}"

          git tag -fa "$MAJOR" -m "Update $MAJOR to $TAG"
          git push origin "$MAJOR" --force

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.27'

      - name: Build release binaries
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist

          declare -A TARGETS=(
            ["linux/amd64"]="linux_amd64"
            ["linux/arm64"]="linux_arm64"
            ["darwin/amd64"]="darwin_amd64"
            ["darwin/arm64"]="darwin_arm64"
          )

          for platform in "${!TARGETS[@]}"; do
            GOOS="${platform%/*}"
            GOARCH="${platform#*/}"
            SUFFIX="${TARGETS[$platform]}"
            ARCHIVE="dist/ghat_${VERSION}_${SUFFIX}.tar.gz"

            CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" go build \
              -ldflags="-s" \
              -trimpath \
              -o dist/ghat \
              ./cmd/ghat

            tar -czf "$ARCHIVE" -C dist ghat
            rm dist/ghat
          done


      - name: Generate license documentation
        run: |
          go install github.com/google/go-licenses@v1.6.0
          go-licenses save ./cmd/ghat --save_path=dist/licenses
          tar -czf dist/licenses.tar.gz -C dist licenses
          sha256sum dist/*.tar.gz > dist/checksums.txt

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/ghat_*_linux_amd64.tar.gz
            dist/ghat_*_linux_arm64.tar.gz
            dist/ghat_*_darwin_amd64.tar.gz
            dist/ghat_*_darwin_arm64.tar.gz
            dist/checksums.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="$GITHUB_REF_NAME"
          PREV_TAG=$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -v "^${TAG}$" | head -1)

          if [ -n "$PREV_TAG" ]; then
            gh release create "$TAG" \
              --title "$TAG" \
              --generate-notes \
              --notes-start-tag "$PREV_TAG" \
              --verify-tag \
              dist/*.tar.gz dist/checksums.txt
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --generate-notes \
              --verify-tag \
              dist/*.tar.gz dist/checksums.txt
          fi
