name: Build and Release Action

on:
  push:
    tags:
      - "v*.*.*"

env:
  REGISTRY: ghcr.io

jobs:
  release:
    runs-on: ubuntu-latest
    environment:
      name: main
      deployment: false
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Tag Docker Image
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          REGISTRY: ${{ env.REGISTRY }}
          REPOSITORY: ${{ github.repository }}
        run: |
          TAG="$GITHUB_REF_NAME"
          MAJOR="${TAG%%.*}"

          DIGEST_REF=$(grep -oP '(?<=docker://)ghcr\.io[^ "]+' action.yml | head -1)
          DIGEST="${DIGEST_REF#*@}"

          # Obtain a registry token with pull+push scope
          TOKEN_B64=$(printf "token:%s" "$GITHUB_TOKEN" | base64 -w 0)
          REG_TOKEN=$(curl -sf \
            -H "Authorization: Basic $TOKEN_B64" \
            "https://ghcr.io/token?scope=repository:${REPOSITORY}:pull,push&service=ghcr.io" \
            | jq -r .token)

          # Fetch the manifest bytes into a temp file (preserves exact bytes → same digest)
          MANIFEST_FILE=$(mktemp)
          curl -sf \
            -H "Authorization: Bearer $REG_TOKEN" \
            -H "Accept: application/vnd.docker.distribution.manifest.v2+json" \
            "https://ghcr.io/v2/${REPOSITORY}/manifests/${DIGEST}" \
            -o "$MANIFEST_FILE"

          CONTENT_TYPE=$(jq -r .mediaType "$MANIFEST_FILE")

          # PUT the identical manifest bytes under version tag and major tag
          for TARGET_TAG in "$TAG" "$MAJOR"; do
            curl -sf -X PUT \
              -H "Authorization: Bearer $REG_TOKEN" \
              -H "Content-Type: $CONTENT_TYPE" \
              --data-binary "@$MANIFEST_FILE" \
              "https://ghcr.io/v2/${REPOSITORY}/manifests/${TARGET_TAG}"
            echo "Tagged ${REGISTRY}/${REPOSITORY}:${TARGET_TAG}"
          done

          rm -f "$MANIFEST_FILE"

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT }}

      - name: Create GitHub App Token
        id: token
        uses: ./
        with:
          app_id: ${{ secrets.BOT_GITHUB_APP_ID }}
          kms_key_id: ${{ secrets.KMS_KEY_ID }}
          kms_keyring_id: ${{ secrets.KMS_KEYRING_ID }}
          kms_location: ${{ vars.KMS_LOCATION }}
          kms_project_id: ${{ vars.KMS_PROJECT_ID }}
          owner: yagihash
          repositories: |
            ghat
          permission_contents: write

      - name: Setup git
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          gh auth setup-git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Update major version tag
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          TAG="$GITHUB_REF_NAME"
          MAJOR="${TAG%%.*}"

          git tag -fa "$MAJOR" -m "Update $MAJOR to $TAG"
          git push origin "$MAJOR" --force

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '1.26'

      - name: Build release binaries
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist

          declare -A TARGETS=(
            ["linux/amd64"]="linux_amd64"
            ["linux/arm64"]="linux_arm64"
            ["darwin/amd64"]="darwin_amd64"
            ["darwin/arm64"]="darwin_arm64"
          )

          for platform in "${!TARGETS[@]}"; do
            GOOS="${platform%/*}"
            GOARCH="${platform#*/}"
            SUFFIX="${TARGETS[$platform]}"
            ARCHIVE="dist/ghat_${VERSION}_${SUFFIX}.tar.gz"

            CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" go build \
              -ldflags="-s -w" \
              -trimpath \
              -o dist/ghat \
              ./cmd/ghat

            tar -czf "$ARCHIVE" -C dist ghat
            rm dist/ghat
          done


      - name: Generate license documentation
        run: |
          go install github.com/google/go-licenses@v1.6.0
          go-licenses save ./cmd/ghat --save_path=dist/licenses
          tar -czf dist/licenses.tar.gz -C dist licenses
          sha256sum dist/*.tar.gz > dist/checksums.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="$GITHUB_REF_NAME"
          PREV_TAG=$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -v "^${TAG}$" | head -1)

          if [ -n "$PREV_TAG" ]; then
            gh release create "$TAG" \
              --title "$TAG" \
              --generate-notes \
              --notes-start-tag "$PREV_TAG" \
              --verify-tag \
              dist/*.tar.gz dist/checksums.txt
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --generate-notes \
              --verify-tag \
              dist/*.tar.gz dist/checksums.txt
          fi
