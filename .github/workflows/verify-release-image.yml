name: Verify action.yml image digest

on:
  pull_request:
    types:
      - opened
      - synchronize
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: read

    steps:
      - name: Checkout repository
        if: startsWith(github.head_ref, 'tagpr-')
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Login to GHCR
        if: startsWith(github.head_ref, 'tagpr-')
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify action.yml digest
        if: startsWith(github.head_ref, 'tagpr-')
        env:
          REGISTRY: ghcr.io
          REPOSITORY: ${{ github.repository }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          BRANCH_TAG="${HEAD_REF//\//-}"
          EXPECTED_TAG="$REGISTRY/$REPOSITORY:$BRANCH_TAG"
          echo "Expecting image: $EXPECTED_TAG"

          MANIFEST=$(docker manifest inspect --verbose "$EXPECTED_TAG" 2>/dev/null || true)
          if [ -z "$MANIFEST" ]; then
            echo "Image $EXPECTED_TAG not found. The build workflow may not have run yet."
            exit 1
          fi

          MANIFEST_DIGEST=$(echo "$MANIFEST" | jq -r '.Descriptor.digest')
          EXPECTED_DIGEST="$REGISTRY/$REPOSITORY@$MANIFEST_DIGEST"
          ACTUAL_DIGEST=$(grep -oP 'ghcr\.io/[^ "]+' action.yml | head -1)

          if [ "$ACTUAL_DIGEST" != "$EXPECTED_DIGEST" ]; then
            echo "FAIL: action.yml digest mismatch"
            echo "Expected: $EXPECTED_DIGEST"
            echo "Actual:   $ACTUAL_DIGEST"
            exit 1
          fi
          echo "OK: action.yml digest matches $EXPECTED_TAG"

  integration-test:
    needs: verify
    if: startsWith(github.head_ref, 'tagpr-from-')
    runs-on: ubuntu-latest
    environment:
      name: main
      deployment: false
    timeout-minutes: 30
    concurrency:
      group: ${{ github.workflow }}-test-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT }}

      - name: Run action
        id: token
        uses: ./
        with:
          app_id: ${{ secrets.BOT_GITHUB_APP_ID }}
          kms_key_id: ${{ secrets.KMS_KEY_ID }}
          kms_keyring_id: ${{ secrets.KMS_KEYRING_ID }}
          kms_location: ${{ vars.KMS_LOCATION }}
          kms_project_id: ${{ vars.KMS_PROJECT_ID }}
          owner: yagihash
          repositories: |
            ghat
          permission_contents: read
          permission_pull_requests: read

      - name: Test token
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          gh auth status
