name: Verify action.yml image digest

on:
  pull_request:
    types:
      - opened
      - synchronize
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: read

    steps:
      - uses: cicd-sensor/cicd-sensor-action@2bc31a18949a77cd5f5bd452f24f00fbb507cdf6 # v0.0.41
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # The digest in action.yml is the integrity anchor of the released action.
      # Only build-release.yml (running on tagpr-* branches) may change it; any
      # other PR touching the image reference is rejected here.
      - name: Verify image reference is unchanged
        if: "!startsWith(github.head_ref, 'tagpr-')"
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          BASE_IMAGE=$(git show "origin/$BASE_REF:action.yml" | grep -oP 'docker://[^ "]+' | head -1)
          HEAD_IMAGE=$(grep -oP 'docker://[^ "]+' action.yml | head -1)

          if [ "$BASE_IMAGE" != "$HEAD_IMAGE" ]; then
            echo "FAIL: the image reference in action.yml may only be updated by the build-release workflow (tagpr-* branches)"
            echo "Base: $BASE_IMAGE"
            echo "Head: $HEAD_IMAGE"
            exit 1
          fi
          echo "OK: image reference unchanged ($HEAD_IMAGE)"

      - name: Login to GHCR
        if: startsWith(github.head_ref, 'tagpr-')
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify action.yml digest
        if: startsWith(github.head_ref, 'tagpr-')
        env:
          REGISTRY: ghcr.io
          REPOSITORY: ${{ github.repository }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          BRANCH_TAG="${HEAD_REF//\//-}"
          EXPECTED_TAG="$REGISTRY/$REPOSITORY:$BRANCH_TAG"
          echo "Expecting image: $EXPECTED_TAG"

          # imagetools returns the digest of the top-level manifest (index) even
          # when the image also carries attestation manifests
          MANIFEST_DIGEST=$(docker buildx imagetools inspect "$EXPECTED_TAG" --format '{{.Manifest.Digest}}' 2>/dev/null || true)
          if [ -z "$MANIFEST_DIGEST" ]; then
            echo "Image $EXPECTED_TAG not found. The build workflow may not have run yet."
            exit 1
          fi

          EXPECTED_DIGEST="$REGISTRY/$REPOSITORY@$MANIFEST_DIGEST"
          ACTUAL_DIGEST=$(grep -oP 'ghcr\.io/[^ "]+' action.yml | head -1)

          if [ "$ACTUAL_DIGEST" != "$EXPECTED_DIGEST" ]; then
            echo "FAIL: action.yml digest mismatch"
            echo "Expected: $EXPECTED_DIGEST"
            echo "Actual:   $ACTUAL_DIGEST"
            exit 1
          fi
          echo "OK: action.yml digest matches $EXPECTED_TAG"
