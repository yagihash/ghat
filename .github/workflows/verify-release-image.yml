name: Verify action.yml image digest

on:
  workflow_run:
    workflows:
      - "Build Docker Image for Release"
    types:
      - completed

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: read
      checks: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          persist-credentials: false

      - name: Get HEAD SHA
        id: head
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        if: github.event.workflow_run.conclusion == 'success'
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify action.yml digest
        id: verify
        if: github.event.workflow_run.conclusion == 'success'
        env:
          REGISTRY: ghcr.io
          REPOSITORY: ${{ github.repository }}
          BUILT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          EXPECTED_TAG="$REGISTRY/$REPOSITORY:sha-$BUILT_SHA"

          echo "Expecting image: $EXPECTED_TAG"

          MANIFEST=$(docker manifest inspect --verbose "$EXPECTED_TAG" 2>/dev/null || true)
          if [ -z "$MANIFEST" ]; then
            echo "Image $EXPECTED_TAG not found."
            exit 1
          fi

          MANIFEST_DIGEST=$(echo "$MANIFEST" | jq -r '.Descriptor.digest')
          EXPECTED_DIGEST="$REGISTRY/$REPOSITORY@$MANIFEST_DIGEST"

          ACTUAL_DIGEST=$(grep -oP 'ghcr\.io/[^ "]+' action.yml | head -1)

          if [ "$ACTUAL_DIGEST" = "$EXPECTED_DIGEST" ]; then
            echo "OK: action.yml digest matches $EXPECTED_TAG"
          else
            echo "FAIL: action.yml digest mismatch"
            echo "Expected: $EXPECTED_DIGEST"
            echo "Actual:   $ACTUAL_DIGEST"
            exit 1
          fi

      - name: Post check run result
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ steps.head.outputs.sha }}
          BUILD_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          if [ "$BUILD_CONCLUSION" != "success" ] || [ "$VERIFY_OUTCOME" = "failure" ]; then
            CONCLUSION="failure"
          else
            CONCLUSION="success"
          fi

          gh api "repos/$REPOSITORY/check-runs" \
            --method POST \
            -f name="verify-release-image" \
            -f head_sha="$HEAD_SHA" \
            -f status="completed" \
            -f conclusion="$CONCLUSION"
