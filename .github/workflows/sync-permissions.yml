name: Sync GitHub App Permissions

on:
  schedule:
    # Sunday 12:00 JST
    - cron: '0 3 * * 0'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    environment:
      name: main
      deployment: false
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - uses: cicd-sensor/cicd-sensor-action@6511eb44c91d71b2b93d71193b1bf2cb18352f66 # v0.0.38
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT }}

      - name: Create GitHub App Token
        id: token
        uses: ./
        with:
          app_id: ${{ secrets.BOT_GITHUB_APP_ID }}
          kms_key_id: ${{ secrets.KMS_KEY_ID }}
          kms_keyring_id: ${{ secrets.KMS_KEYRING_ID }}
          kms_location: ${{ vars.KMS_LOCATION }}
          kms_project_id: ${{ vars.KMS_PROJECT_ID }}

      - name: Get OpenAPI schema file
        run: |
          curl -fsSL https://raw.githubusercontent.com/github/rest-api-description/main/descriptions/api.github.com/api.github.com.json -o "$RUNNER_TEMP/api.github.com.json"

      - name: Update action.yml
        run: |
          ./scripts/update-permissions.sh "$RUNNER_TEMP/api.github.com.json"

      - name: Setup git
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          gh auth setup-git

      - name: Create Pull Request with GitHub CLI
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          BRANCH_NAME="feature/sync-permissions-$(date +%Y%m%d)"
          REPO="${GITHUB_REPOSITORY}"

          # Create a PR only when action.yml has changed
          if [[ -n $(git status --porcelain action.yml) ]]; then
            DIFF=$(git diff HEAD -- action.yml)

            # Create a signed commit via the GitHub API
            BASE_SHA=$(git rev-parse HEAD)
            BASE_TREE=$(gh api "repos/${REPO}/git/commits/${BASE_SHA}" --jq '.tree.sha')

            BLOB_SHA=$(gh api "repos/${REPO}/git/blobs" \
              --field encoding=base64 \
              --field content="$(base64 -w0 action.yml)" \
              --jq '.sha')

            TREE_SHA=$(jq -n \
              --arg base_tree "${BASE_TREE}" \
              --arg sha "${BLOB_SHA}" \
              '{base_tree: $base_tree, tree: [{path: "action.yml", mode: "100644", type: "blob", sha: $sha}]}' | \
              gh api "repos/${REPO}/git/trees" --input - --jq '.sha')

            COMMIT_SHA=$(jq -n \
              --arg msg "chore: sync GitHub App permissions" \
              --arg tree "${TREE_SHA}" \
              --arg parent "${BASE_SHA}" \
              '{message: $msg, tree: $tree, parents: [$parent]}' | \
              gh api "repos/${REPO}/git/commits" --input - --jq '.sha')

            # Create or force-update the branch ref
            gh api "repos/${REPO}/git/refs" \
              --field ref="refs/heads/${BRANCH_NAME}" \
              --field sha="${COMMIT_SHA}" 2>/dev/null || \
            gh api "repos/${REPO}/git/refs/heads/${BRANCH_NAME}" \
              --method PATCH \
              --field sha="${COMMIT_SHA}" \
              --field force=true

            PR_URL=$(gh pr create \
              --title "🤖 Sync GitHub App Permissions" \
              --body "This PR updates \`action.yml\` inputs and args based on the latest GitHub App permissions from github/rest-api-description." \
              --base main \
              --head "$BRANCH_NAME" \
              --reviewer yagihash 2>&1 || gh pr view "$BRANCH_NAME" --json url --jq '.url')

            {
              echo "## Sync GitHub App Permissions"
              echo ""
              echo "✅ **Changes detected.** A pull request has been created or updated."
              echo ""
              echo "**Pull Request:** $PR_URL"
              echo ""
              echo "### Diff"
              echo '```diff'
              echo "${DIFF}"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No changes detected in action.yml"

            {
              echo "## Sync GitHub App Permissions"
              echo ""
              echo "☑️ **No changes detected.** \`action.yml\` is already up to date."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
